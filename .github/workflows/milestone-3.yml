name: Milestone 3 Frontend

on:
  push:
    branches: [main, milestone-3-delivery]
    paths:
      - 'app/**'
      - '.github/workflows/milestone-3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/milestone-3.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  application:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/.bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run application gate
        run: bun run check
